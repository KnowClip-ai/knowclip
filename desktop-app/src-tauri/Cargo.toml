[package]
name = "knowclip"
version = "0.1.0"
description = "KnowClip - Long video to highlight clips"
authors = ["KnowClip"]
edition = "2021"

[lib]
name = "knowclip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# 媒体服务器（视频流式播放）
portpicker = "0.1"
once_cell = "1.19"
tokio = { version = "1.35", features = ["rt", "rt-multi-thread", "macros", "fs", "io-util", "time", "net"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["fs", "cors"] }
